[tool.poetry]
name = "quantum-orb-backend"
version = "1.0.0"
description = "Quantum Orb indexer, relayer and leaderboard API"
authors = ["Quantum Orb team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.1.4"
djangorestframework = "^3.15.2"
django-cors-headers = "^4.6.0"
psycopg = { extras = ["binary"], version = "^3.2.3" }
dj-database-url = "^2.3.0"
python-dotenv = "^1.0.1"
web3 = "^7.6.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-django = "^4.9.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.4"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # web3 7 still imports websockets.legacy; not ours to fix.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Django writes migrations; they are generated artefacts, not authored code,
# and reformatting them to fit a line limit risks breaking them.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
