specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: QuantumOrb
    network: blast-testnet
    source:
      address: "0x9c94e5D2F4024F74B591d806A7C7D64abB901f0c"
      abi: QuantumOrb
      startBlock: 1671241
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AdminChanged
        - Upgraded
      abis:
        - name: QuantumOrb
          file: ./abis/QuantumOrb.json
      eventHandlers:
        - event: AdminChanged(address,address)
          handler: handleAdminChanged
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/quantum-orb.ts
