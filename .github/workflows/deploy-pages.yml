name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run set-env
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          CHAIN_NAME: ${{ vars.CHAIN_NAME }}
          RPC_URL: ${{ vars.RPC_URL }}
          BLOCK_EXPLORER_URL: ${{ vars.BLOCK_EXPLORER_URL }}

      - run: npm run build -- --base-href=/quantum-orb/
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - id: deployment
        uses: actions/deploy-pages@v4
