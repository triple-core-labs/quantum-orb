name: backend

on:
  push:
    paths:
      - "backend/**"
      - "contracts/abi/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/abi/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantumorb
          POSTGRES_PASSWORD: quantumorb
          POSTGRES_DB: quantumorb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantumorb"
          --health-interval 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DATABASE_URL: postgres://quantumorb:quantumorb@localhost:5432/quantumorb
      CONTRACT_ABI_PATH: ${{ github.workspace }}/contracts/abi/QuantumOrb.json
      CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000001"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check backend

      - name: Format check
        run: poetry run ruff format --check backend

      - name: Test
        run: poetry run pytest -q
