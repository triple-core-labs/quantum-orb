name: frontend

on:
  push:
    paths:
      - "frontend/**"
      - "contracts/abi/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/abi/**"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Verify the synced ABI is current
        run: |
          npm run sync-abi
          git diff --exit-code src/app/contract/quantum-orb.abi.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
