services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantumorb
      POSTGRES_PASSWORD: quantumorb
      POSTGRES_DB: quantumorb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumorb"]
      interval: 5s
      retries: 10

  migrate:
    image: quantum-orb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgres://quantumorb:quantumorb@db:5432/quantumorb
    volumes:
      - ./contracts/abi:/app/contracts/abi:ro
      - ./backend/backend:/app/backend
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    image: quantum-orb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgres://quantumorb:quantumorb@db:5432/quantumorb
    volumes:
      # The exported ABI is the single source of truth, mounted read-only.
      - ./contracts/abi:/app/contracts/abi:ro
      - ./backend/backend:/app/backend
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  indexer:
    image: quantum-orb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgres://quantumorb:quantumorb@db:5432/quantumorb
    volumes:
      - ./contracts/abi:/app/contracts/abi:ro
      - ./backend/backend:/app/backend
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    command: ["python", "manage.py", "index_events"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  relayer:
    image: quantum-orb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgres://quantumorb:quantumorb@db:5432/quantumorb
    volumes:
      - ./contracts/abi:/app/contracts/abi:ro
      - ./backend/backend:/app/backend
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    command: ["python", "manage.py", "relay_reveals"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
