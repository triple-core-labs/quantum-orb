<a class="logo-link" routerLink="home" aria-label="Quantum Orb home">
  <svg class="logo" viewBox="0 0 66 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M51.576 66.392L65.144 79.832H47.48C45.304 77.656 41.208 73.304 39.16 71.128H7.672L3.704 66.904C3.704 66.776 6.904 63.576 7.032 63.448L0.888 57.432V14.296L14.968 0.215996H47.224L58.616 11.736L53.496 16.856V34.648C55.544 32.6 59.256 28.888 61.432 26.84V56.536L51.576 66.392ZM46.968 23.384V19.928V19.8V19.672L40.824 13.528H21.496L15.352 19.672V51.8L17.144 53.336L12.92 57.56H40.824C41.464 56.92 46.328 52.184 46.968 51.544V41.176L39.16 49.112V31.192L46.968 23.384Z"
      fill="#F8EF00"
    />
  </svg>
</a>

<nav>
  <a routerLink="home" routerLinkActive="active" (click)="closeMenu()">HOME</a>
  <a routerLink="orbs" routerLinkActive="active" (click)="closeMenu()">ORBS</a>
  <a routerLink="leaderboard" routerLinkActive="active" (click)="closeMenu()">LEADERBOARD</a>
  <a routerLink="referrals" routerLinkActive="active" (click)="closeMenu()">REFERRALS</a>
  <a routerLink="faq" routerLinkActive="active" (click)="closeMenu()">FAQ</a>
</nav>

@if (address(); as connected) {
  <p class="address">{{ connected | shortAddress }}</p>
} @else {
  <button
    class="action-button"
    type="button"
    [disabled]="!walletAvailable()"
    (click)="connect()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <path
        d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V192c0-35.3-28.7-64-64-64H80c-8.8 0-16-7.2-16-16s7.2-16 16-16H448c17.7 0 32-14.3 32-32s-14.3-32-32-32H64zM416 272a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"
      />
    </svg>
    <span>{{ label() }}</span>
  </button>
}

<button class="menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" id="burger">
    <path
      d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z"
    />
  </svg>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" id="close">
    <path
      d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"
    />
  </svg>
</button>
