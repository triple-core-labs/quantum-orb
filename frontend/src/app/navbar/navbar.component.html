<a class="logo-link" routerLink="home" aria-label="Quantum Orb home">
  <svg class="logo" viewBox="0 0 66 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M51.576 66.392L65.144 79.832H47.48C45.304 77.656 41.208 73.304 39.16 71.128H7.672L3.704 66.904C3.704 66.776 6.904 63.576 7.032 63.448L0.888 57.432V14.296L14.968 0.215996H47.224L58.616 11.736L53.496 16.856V34.648C55.544 32.6 59.256 28.888 61.432 26.84V56.536L51.576 66.392ZM46.968 23.384V19.928V19.8V19.672L40.824 13.528H21.496L15.352 19.672V51.8L17.144 53.336L12.92 57.56H40.824C41.464 56.92 46.328 52.184 46.968 51.544V41.176L39.16 49.112V31.192L46.968 23.384Z"
      fill="#F8EF00"
    />
  </svg>
</a>

<button class="burger" type="button" (click)="toggleMenu($event)" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<nav>
  <a routerLink="home" routerLinkActive="active">HOME</a>
  <a routerLink="orbs" routerLinkActive="active">ORBS</a>
  <a routerLink="leaderboard" routerLinkActive="active">LEADERBOARD</a>
  <a routerLink="referrals" routerLinkActive="active">REFERRALS</a>
</nav>

@if (address(); as connected) {
  <span class="wallet-address">{{ connected | shortAddress }}</span>
} @else {
  <button
    class="action-button"
    type="button"
    [disabled]="!walletAvailable"
    (click)="connect()"
  >
    {{ label() }}
  </button>
}
