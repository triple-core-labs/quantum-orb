specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: QuantumOrb
    network: blast-testnet
    source:
      address: "0x79b8bA2704d35Cba5362d7D7439D0716BD9E2E76"
      abi: QuantumOrb
      startBlock: 1792852
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Initialized
        - OrbOpened
        - UserInitialized
        - UserUpdated
        - UserXLinked
      abis:
        - name: QuantumOrb
          file: ./abis/QuantumOrb.json
      eventHandlers:
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: OrbOpened(indexed address,uint256)
          handler: handleOrbOpened
        - event: UserInitialized(indexed address,indexed address)
          handler: handleUserInitialized
        - event: UserUpdated(indexed address,uint256,uint256)
          handler: handleUserUpdated
        - event: UserXLinked(indexed address,string)
          handler: handleUserXLinked
      file: ./src/quantum-orb.ts
